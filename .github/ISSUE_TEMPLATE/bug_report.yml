name: Bug report
description: Report a problem with PwDone
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem.

        **Do not attach encrypted files, passwords, recovered passwords, license
        keys or personal data.** A screenshot of the error is usually enough.

  - type: input
    id: version
    attributes:
      label: PwDone version
      description: Shown in the app or in the installer file name.
      placeholder: "0.1.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 10
        - Windows 11
        - macOS 14 (Apple Silicon)
        - macOS 15 (Apple Silicon)
        - Other
    validations:
      required: true

  - type: dropdown
    id: format
    attributes:
      label: File format
      options:
        - ZIP
        - RAR
        - 7z
        - PDF
        - Word
        - Excel
        - PowerPoint
        - Other / not format-specific
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open PwDone
        2. Select a file
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior

  - type: textarea
    id: actual
    attributes:
      label: What happened instead

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove personal paths, file names, passwords and license keys.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have removed personal data, file names, passwords and license keys.
          required: true
